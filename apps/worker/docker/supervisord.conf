[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

# Xvfb chạy luôn, kể cả khi WORKER_GUI=off: framebuffer 1080x1920 tốn ~8 MB RAM
# và gần như không tốn CPU khi không ai vẽ lên nó. Giữ lại để công cụ nào cần
# DISPLAY vẫn có, và để bật lại GUI không phải khởi động lại cả container.
[program:xvfb]
command=Xvfb :0 -screen 0 1080x1920x24 -ac
autorestart=true
priority=10

# Ba program dưới đây là toàn bộ đường xem màn hình emulator. WORKER_GUI=off
# thì chúng không khởi động.
#
# Nặng nhất là x11vnc: nó quét framebuffer liên tục để phát hiện thay đổi, và
# vẫn quét kể cả khi không có trình duyệt nào kết nối. Trên VPS yếu đây là
# nguồn tốn CPU thầm lặng lớn nhất sau bản thân emulator.
#
# %(ENV_WORKER_GUI)s lấy từ biến môi trường. Dockerfile đặt sẵn mặc định `on`
# nên thiếu biến cũng không làm supervisor chết lúc khởi động.
[program:openbox]
command=openbox
environment=DISPLAY=":0"
autostart=%(ENV_WORKER_GUI)s
autorestart=true
priority=20

[program:x11vnc]
command=x11vnc -display :0 -nopw -forever -shared -rfbport 5900
autostart=%(ENV_WORKER_GUI)s
autorestart=true
priority=30

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autostart=%(ENV_WORKER_GUI)s
autorestart=true
priority=40

[program:worker-node]
command=/app/apps/worker/docker/entrypoint.sh
environment=DISPLAY=":0",HOME="/home/worker",ANDROID_SDK_ROOT="/opt/android-sdk",ANDROID_AVD_HOME="/home/worker/.android/avd"
autorestart=true
priority=50
