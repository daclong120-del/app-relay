version: '3.8'

services:
  app-relay-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-relay-worker
    restart: unless-stopped
    environment:
      - WORKER_NAME=docker-app-relay-worker-01
      - GATEWAY_URL=${GATEWAY_URL:-http://host.docker.internal:3000/api/release-ops/worker/v1}
      - WORKER_TOKEN=${WORKER_TOKEN:-dev-worker-token-secret-key}
      - ADB_DEVICE_SERIAL=${ADB_DEVICE_SERIAL:-emulator-5554}
      - MAX_PARALLEL_JOBS=1
      - POLL_INTERVAL_MS=5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
