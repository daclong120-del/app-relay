openapi: 3.1.0
info:
  version: 1.0.0
  title: AppRelay Frontend API (Auto-Generated from TypeScript)
  description: REST contract between the SinoMedia main frontend and the AppRelay
    control plane. Generated code-first from Zod schemas.
  contact:
    name: SinoMedia Release Ops
  license:
    name: Proprietary
servers:
  - url: /api/app-relay/v1
    description: Same-origin AppRelay frontend API for dual dashboards
components:
  securitySchemes:
    supabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token for an authenticated admin.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required for user-triggered state-changing operations.
  schemas:
    JobStatus:
      type: string
      enum:
        - queued
        - claimed
        - running
        - succeeded
        - failed
        - retrying
        - dead_letter
        - cancelled
        - expired
      description: Current status of the AppRelay job.
    JobStage:
      type: string
      enum:
        - validate_url
        - acquire_listing
        - pull_apk
        - verify_apk
        - upload_storage
        - complete
      description: AppRelay execution pipeline stage.
    WorkerStatus:
      type: string
      enum:
        - online
        - busy
        - offline
        - degraded
      description: Worker operational status.
    AppRelayDeviceProfile:
      type: object
      properties:
        sdk:
          type: integer
          example: 34
        abi:
          type: string
          example: arm64-v8a
        density:
          type: integer
          example: 480
        locale:
          type: string
          example: en_US
      required:
        - sdk
        - abi
        - density
        - locale
    CreateJobRequest:
      type: object
      properties:
        playUrl:
          type: string
          format: uri
          description: Official Google Play details URL.
          example: https://play.google.com/store/apps/details?id=com.example.app&hl=en
        locale:
          type: string
          example: en
        includeListing:
          type: boolean
          default: true
          example: true
        includeScreenshots:
          type: boolean
          default: true
          example: true
      required:
        - playUrl
    ActionReasonRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          description: Optional user-provided cancellation or retry reason.
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 8b6bbfd8-62da-4c36-a49b-4e99f778f587
        jobType:
          type: string
          enum:
            - pull_apk
          example: pull_apk
        status:
          $ref: "#/components/schemas/JobStatus"
        priority:
          type: integer
          example: 100
        releaseId:
          type:
            - string
            - "null"
          format: uuid
        appId:
          type:
            - string
            - "null"
        packageId:
          type: string
          example: com.example.app
        workerId:
          type:
            - string
            - "null"
          format: uuid
        attemptCount:
          type: integer
          example: 1
        maxAttempts:
          type: integer
          example: 3
        errorMessage:
          type:
            - string
            - "null"
        createdBy:
          type:
            - string
            - "null"
          format: uuid
        createdAt:
          type: string
          format: date-time
          example: 2026-08-06T09:00:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-08-06T09:05:00Z
      required:
        - id
        - jobType
        - status
        - priority
        - packageId
        - attemptCount
        - maxAttempts
        - createdAt
        - updatedAt
    JobEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        level:
          type: string
          enum:
            - info
            - warn
            - error
        stage:
          $ref: "#/components/schemas/JobStage"
        message:
          type: string
        progress:
          type: number
          minimum: 0
          maximum: 100
        metadata:
          type: object
          additionalProperties: {}
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - jobId
        - level
        - stage
        - message
        - progress
        - createdAt
    Artifact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        fileName:
          type: string
        checksum:
          type:
            - string
            - "null"
        storagePath:
          type: string
        artifactType:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        deletedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - jobId
        - fileName
        - storagePath
        - artifactType
        - contentType
        - sizeBytes
        - createdAt
    Worker:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workerName:
          type: string
        status:
          $ref: "#/components/schemas/WorkerStatus"
        maxParallelJobs:
          type: integer
        lastHeartbeat:
          type:
            - string
            - "null"
          format: date-time
        metadata:
          type: object
          additionalProperties: {}
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - workerName
        - status
        - maxParallelJobs
        - createdAt
        - updatedAt
    OverviewResponse:
      type: object
      properties:
        totalJobs:
          type: integer
          example: 1250
        activeJobs:
          type: integer
          example: 4
        succeededJobs:
          type: integer
          example: 1180
        failedJobs:
          type: integer
          example: 66
        onlineWorkers:
          type: integer
          example: 2
      required:
        - totalJobs
        - activeJobs
        - succeededJobs
        - failedJobs
        - onlineWorkers
    JobResponse:
      type: object
      properties:
        job:
          $ref: "#/components/schemas/Job"
      required:
        - job
    JobListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        pagination:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            totalItems:
              type: integer
            totalPages:
              type: integer
          required:
            - page
            - pageSize
            - totalItems
            - totalPages
      required:
        - data
        - pagination
    EventListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/JobEvent"
        nextCursor:
          type:
            - string
            - "null"
      required:
        - data
    DownloadUrlResponse:
      type: object
      properties:
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
      required:
        - downloadUrl
        - expiresAt
    ArtifactDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
        artifactId:
          type: string
          format: uuid
      required:
        - success
        - artifactId
    WorkerListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Worker"
        pagination:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            totalItems:
              type: integer
            totalPages:
              type: integer
          required:
            - page
            - pageSize
            - totalItems
            - totalPages
      required:
        - data
        - pagination
    WorkerResponse:
      type: object
      properties:
        worker:
          $ref: "#/components/schemas/Worker"
      required:
        - worker
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
              format: uuid
            retryable:
              type: boolean
              default: false
          required:
            - code
            - message
      required:
        - error
    Page:
      type: integer
      minimum: 1
      default: 1
    PageSize:
      type: integer
      minimum: 1
      maximum: 100
      default: 25
    Search:
      type: string
      minLength: 1
      maxLength: 200
    JobId:
      type: string
      format: uuid
    WorkerIdPath:
      type: string
      format: uuid
  parameters:
    Page:
      schema:
        $ref: "#/components/schemas/Page"
      required: false
      name: page
      in: query
      description: One-based page number.
    PageSize:
      schema:
        $ref: "#/components/schemas/PageSize"
      required: false
      name: pageSize
      in: query
      description: Number of resources per page.
    Search:
      schema:
        $ref: "#/components/schemas/Search"
      required: false
      name: search
      in: query
      description: Case-insensitive search by package ID or job ID.
    JobId:
      schema:
        $ref: "#/components/schemas/JobId"
      required: true
      name: jobId
      in: path
      description: AppRelay job UUID.
    WorkerIdPath:
      schema:
        $ref: "#/components/schemas/WorkerIdPath"
      required: true
      name: workerId
      in: path
      description: Registered worker UUID.
paths:
  /overview:
    get:
      tags:
        - Overview
      summary: Get AppRelay operational summary
      description: Returns compact metrics for the AppRelay overview page.
      responses:
        "200":
          description: Operational summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal Server Error
  /jobs:
    get:
      tags:
        - Jobs
      summary: List AppRelay jobs
      description: Returns paginated pull_apk jobs.
      parameters:
        - schema:
            type: number
          required: false
          name: page
          in: query
        - schema:
            type: number
          required: false
          name: pageSize
          in: query
        - schema:
            type: string
          required: false
          name: search
          in: query
      responses:
        "200":
          description: Paginated jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal Server Error
    post:
      tags:
        - Jobs
      summary: Create an APK acquisition job
      description: Validates Google Play details URL and creates a pull_apk job.
      security:
        - supabaseBearer: []
          csrfToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "202":
          description: Job accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "409":
          description: Conflict
        "422":
          description: Unprocessable Entity
  /jobs/{jobId}:
    get:
      tags:
        - Jobs
      summary: Get complete AppRelay job detail
      description: Returns the job read model plus its assigned worker, artifact, and
        events.
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: jobId
          in: path
      responses:
        "200":
          description: Complete job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
  /jobs/{jobId}/events:
    get:
      tags:
        - Events
      summary: List append-only events for a job
      description: Cursor-paginated timeline endpoint for a job.
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: jobId
          in: path
      responses:
        "200":
          description: Event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
  /jobs/{jobId}/cancel:
    post:
      tags:
        - Jobs
      summary: Cancel or request cancellation of a job
      security:
        - supabaseBearer: []
          csrfToken: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: jobId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionReasonRequest"
      responses:
        "202":
          description: Cancellation applied or requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "409":
          description: Conflict
  /jobs/{jobId}/retry:
    post:
      tags:
        - Jobs
      summary: Retry an eligible failed job
      security:
        - supabaseBearer: []
          csrfToken: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: jobId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionReasonRequest"
      responses:
        "202":
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "409":
          description: Conflict
  /jobs/{jobId}/artifact/download-url:
    post:
      tags:
        - Artifacts
      summary: Create a short-lived artifact download URL
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: jobId
          in: path
      responses:
        "200":
          description: Signed download handoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadUrlResponse"
        "404":
          description: Not Found
        "410":
          description: Gone
  /jobs/{jobId}/artifact:
    delete:
      tags:
        - Artifacts
      summary: Delete the durable artifact
      security:
        - supabaseBearer: []
          csrfToken: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: jobId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionReasonRequest"
      responses:
        "200":
          description: Artifact deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDeleteResponse"
        "404":
          description: Not Found
  /workers:
    get:
      tags:
        - Workers
      summary: List AppRelay-capable workers
      responses:
        "200":
          description: Paginated AppRelay workers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerListResponse"
        "500":
          description: Internal Server Error
  /workers/{workerId}:
    get:
      tags:
        - Workers
      summary: Get worker and device readiness detail
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: workerId
          in: path
      responses:
        "200":
          description: Worker detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerResponse"
        "404":
          description: Not Found
webhooks: {}
