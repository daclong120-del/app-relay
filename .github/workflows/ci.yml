name: AppRelay CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Run All AppRelay Test Suites & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        # No `version` input: the pnpm version comes from the root
        # package.json `packageManager` field. Passing both makes the action
        # fail with "Multiple versions of pnpm specified".
        uses: pnpm/action-setup@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All Packages & Apps
        run: pnpm build

      - name: Execute Test Matrix
        run: pnpm test

  db-migrate:
    name: Apply Supabase Migrations
    runs-on: ubuntu-latest
    needs: test-and-verify
    if: github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        # No `version` input: the pnpm version comes from the root
        # package.json `packageManager` field. Passing both makes the action
        # fail with "Multiple versions of pnpm specified".
        uses: pnpm/action-setup@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pnpm exec tsx scripts/db-migrate.ts --apply

  build-and-push:
    name: Build & Push Images to Docker Hub
    runs-on: ubuntu-latest
    needs: db-migrate
    if: github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/app-relay-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/app-relay-api:${{ github.sha }}

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/worker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/app-relay-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/app-relay-worker:${{ github.sha }}

  deploy-to-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            # appleboy/ssh-action KHÔNG dừng khi một lệnh fail (script_stop mặc
            # định false). Không có set -e thì `compose pull` hỏng vẫn chạy tiếp
            # tới dòng echo "✅" và job báo xanh.
            set -e

            cd ${{ secrets.VPS_DEPLOY_PATH || '/root/app-relay' }}

            # Image do job ③ build, nhưng file compose / Caddyfile thì KHÔNG nằm
            # trong image — chúng đọc từ đĩa VPS. Không đồng bộ git ở đây thì mọi
            # thay đổi trong deploy/ không bao giờ tới máy đích.
            test -d .git || {
              echo "❌ $PWD không phải git clone. Deploy cần clone repo về đây trước:"
              echo "   git clone <repo-url> ${{ secrets.VPS_DEPLOY_PATH || '/root/app-relay' }}"
              exit 1
            }
            git fetch --prune origin
            git checkout -f ${{ github.ref_name }}
            # reset --hard, không phải pull: git là nguồn sự thật cho file compose,
            # và commit này phải khớp đúng commit đã build ra image. Lệnh này XOÁ
            # mọi sửa tay trên file đã track ở VPS. File .env* không bị đụng vì
            # chúng gitignore (untracked không nằm trong tầm reset --hard).
            git reset --hard ${{ github.sha }}

            if [ -d "deploy" ]; then cd deploy; fi
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"

            # Không truyền -f. Chuỗi file compose nằm ở COMPOSE_FILE trong
            # deploy/.env do bootstrap.sh sinh ra — nó chạy trên chính máy đích
            # nên nó mới biết máy có /dev/kvm hay không, có chạy Supabase
            # self-host hay không. -f tường minh ở đây sẽ ĐÈ COMPOSE_FILE và làm
            # rơi mất compose.prod.yaml (xoay log, stop_grace_period của worker)
            # lẫn compose.supabase.yaml — mà --remove-orphans thì xoá luôn các
            # container thuộc overlay bị rơi.
            docker compose pull
            docker compose --profile production up -d --remove-orphans
            docker image prune -f
            echo "✅ App Relay deployed successfully"
