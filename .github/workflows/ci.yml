name: AppRelay CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Run All AppRelay Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Execute Unified Test Matrix
        run: npx tsx scripts/run-all-tests.ts

  build-container:
    name: Build AppRelay Worker Docker Image
    runs-on: ubuntu-latest
    needs: test-and-verify

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./workers/app-relay-worker
          file: ./workers/app-relay-worker/Dockerfile
          push: false
          tags: app-relay-worker:latest
