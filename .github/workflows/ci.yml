name: AppRelay CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Run All AppRelay Test Suites & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        # No `version` input: the pnpm version comes from the root
        # package.json `packageManager` field. Passing both makes the action
        # fail with "Multiple versions of pnpm specified".
        uses: pnpm/action-setup@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All Packages & Apps
        run: pnpm build

      - name: Execute Test Matrix
        run: pnpm test

  db-migrate:
    name: Apply Supabase Migrations
    runs-on: ubuntu-latest
    needs: test-and-verify
    if: github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        # No `version` input: the pnpm version comes from the root
        # package.json `packageManager` field. Passing both makes the action
        # fail with "Multiple versions of pnpm specified".
        uses: pnpm/action-setup@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pnpm exec tsx scripts/db-migrate.ts --apply

  build-and-push:
    name: Build & Push API Image to Docker Hub
    runs-on: ubuntu-latest
    needs: db-migrate
    if: github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/app-relay-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/app-relay-api:${{ github.sha }}

      # Worker image CỐ Ý không build ở đây.
      #
      # apps/worker/Dockerfile có `COPY avd-seed/ /opt/avd-seed/`, mà
      # avd-seed/avd-seed.tar.gz bị .gitignore chặn (2.5 GB, chứa phiên đăng
      # nhập Google). CI checkout từ git nên thư mục đó luôn rỗng → image CI
      # tạo ra chạy được nhưng KHÔNG có phiên đăng nhập CH Play, và đẩy lên tag
      # `latest` là ghi đè mất bản có seed.
      #
      # Worker image chỉ được build và push từ máy đang giữ avd-seed:
      #     docker compose build worker
      #     docker push <user>/app-relay-worker:latest
      #
      # Chi tiết: docs/docker.md, docs/CI-CD.md

  deploy-to-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      # ── ①  Đẩy file cấu hình sang VPS ────────────────────────────────────
      #
      # Image nằm trên Docker Hub, nhưng compose*.yaml / Caddyfile / SQL khởi
      # tạo DB thì KHÔNG nằm trong image — `docker compose` đọc thẳng từ đĩa
      # VPS. Trước đây việc này do `git reset --hard` trên VPS đảm nhiệm; giờ
      # bỏ git nên phải chép thẳng từ runner sang.
      #
      # Runner checkout từ git nên .env, .env.api, .env.worker (đều gitignore)
      # KHÔNG có trong workspace → không bị chép đè. Secret trên VPS an toàn.
      - name: Sync deploy config to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "deploy/,supabase/migrations/"
          target: ${{ secrets.VPS_DEPLOY_PATH || '/root/app-relay' }}
          overwrite: true

      # ── ②  Kéo image và dựng lại stack ───────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            # appleboy/ssh-action KHÔNG dừng khi một lệnh fail (script_stop mặc
            # định false). Không có set -e thì `compose pull` hỏng vẫn chạy tiếp
            # tới dòng echo "✅" và job báo xanh.
            set -e

            cd ${{ secrets.VPS_DEPLOY_PATH || '/root/app-relay' }}
            if [ -d "deploy" ]; then cd deploy; fi

            # Bước ① chép được thì file này phải có. Thiếu nghĩa là VPS chưa
            # chạy bootstrap.sh lần nào — pull rồi up cũng vô nghĩa vì không có
            # COMPOSE_FILE, không có secret.
            test -f .env || {
              echo "❌ Không thấy $PWD/.env — VPS chưa bootstrap."
              echo "   Chạy một lần trên VPS: cd deploy && ./bootstrap.sh"
              exit 1
            }

            # scp không giữ bit thực thi. Không có dòng này thì lần sau gõ
            # ./bootstrap.sh hay ./gui.sh trên VPS sẽ ra "Permission denied".
            chmod +x ./*.sh 2>/dev/null || true

            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"

            # Worker image chứa seed đăng nhập Google nên repo Docker Hub để
            # PRIVATE — không login thì `compose pull` fail với "pull access
            # denied", rất dễ đọc nhầm thành "image không tồn tại".
            echo "${{ secrets.DOCKERHUB_TOKEN }}" \
              | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Không truyền -f, cũng không truyền --profile. Cả hai đọc từ
            # COMPOSE_FILE / COMPOSE_PROFILES trong deploy/.env do bootstrap.sh
            # sinh ra — nó chạy trên chính máy đích nên nó mới biết máy có
            # /dev/kvm không, chạy Supabase self-host không, đang HTTPS hay
            # --http-only.
            #
            # Cờ tường minh ở đây ĐÈ giá trị trong .env, và cả hai lần đè đều hỏng:
            #   -f  → rơi compose.prod.yaml (xoay log, stop_grace_period của
            #         worker) lẫn compose.supabase.yaml, mà --remove-orphans thì
            #         xoá luôn container thuộc overlay bị rơi.
            #   --profile production → dựng caddy dậy ngay cả ở chế độ
            #         --http-only, nơi bootstrap cố ý để COMPOSE_PROFILES rỗng.
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "✅ App Relay deployed successfully"
