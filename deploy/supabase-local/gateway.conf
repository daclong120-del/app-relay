# Gateway that gives PostgREST the URL shape @supabase/supabase-js expects.
# supabase-js always calls ${SUPABASE_URL}/rest/v1/<table> and
# ${SUPABASE_URL}/rest/v1/rpc/<fn>, so the /rest/v1 prefix is stripped here and
# the rest is handed to PostgREST untouched.

server {
    listen 8000;
    server_name _;

    # Artifact uploads never touch this path, but job payloads with a long
    # listing description can still exceed nginx's 1m default.
    client_max_body_size 16m;

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 404 '{"error":{"code":"NOT_FOUND","message":"Only /rest/v1 is exposed by the local Supabase gateway"}}';
        add_header Content-Type application/json always;
    }
}
