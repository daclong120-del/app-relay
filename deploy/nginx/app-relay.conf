# Cửa vào HTTP của app-relay trên VM chạy stack (10.10.10.168).
#
# Luồng đầy đủ một request từ đối tác:
#
#   https://app-relay.lutech.vn
#     → Cloudflare            (proxy cam, TLS kết thúc ở đây)
#       → nginx máy host      79.108.216.178:80   ← KHÔNG phải máy này, xem docs
#         → nginx VM này      10.10.10.168:80     ← file này
#           → container api   127.0.0.1:5500
#
# Vì sao còn một lớp nginx nữa ở đây thay vì để host trỏ thẳng vào 5500: API
# bind `127.0.0.1:5500` trong compose.yml, cố ý không phơi ra LAN. Container chỉ
# nghe loopback nên chỉ tiến trình trên chính VM này gọi được — nginx ở đây là
# tiến trình đó. Mở 5500 ra LAN sẽ bỏ mất lớp chặn `/internal/` bên dưới.
#
# Cài bằng `deploy/nginx/install.sh` (chạy root trên VM), đừng sửa tay bản trong
# /etc/nginx — bản trong repo mới là bản đúng.

# Host lạ thì cắt kết nối, không trả gì cả.
#
# Không có block này thì server block đầu tiên nginx nạp sẽ mặc nhiên thành
# default_server cho cổng 80, tức mọi request với Host bất kỳ — kể cả scan từ
# LAN — đều được proxy thẳng vào API. 444 là mã riêng của nginx: đóng kết nối
# không phản hồi, rẻ hơn và không xác nhận cho người quét biết có gì ở đây.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;

    # app-relay.lutech.vn là tên chính thức giao cho đối tác.
    # apk.bohubo.com giữ lại vì đã cấu hình từ trước; cùng backend, bỏ đi sẽ làm
    # chết đường cũ mà không báo trước cho ai.
    server_name app-relay.lutech.vn apk.bohubo.com;

    # Log riêng. Nằm chung access.log của nginx thì lẫn với vhost khác, lúc có
    # sự cố không tách được request nào của app-relay.
    access_log /var/log/nginx/app-relay.access.log;
    error_log  /var/log/nginx/app-relay.error.log;

    # `/internal/v1/*` là mặt phẳng của worker, xác thực bằng WORKER_TOKEN.
    # Worker gọi thẳng http://api:5500 qua mạng Docker nội bộ nên không bao giờ
    # đi qua đây — mọi request tới `/internal/` ở lớp này đều là từ Internet vào.
    #
    # 404 chứ không phải 403, giống Caddyfile: 403 xác nhận cho người ngoài biết
    # đường dẫn có tồn tại, 404 thì không nói gì thêm.
    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:5500;
        proxy_http_version 1.1;

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Ghim cứng `https`, KHÔNG dùng $scheme.
        #
        # API dựng link tải artifact bằng `${req.protocol}://${req.get('host')}`
        # (apps/api/src/modules/jobs/jobs.router.ts) với `trust proxy` bật, tức
        # req.protocol lấy từ header này. Chặng Cloudflare → host → VM chạy HTTP
        # trần, nên $scheme ở đây là "http" và link giao cho đối tác sẽ ra
        # http://app-relay.lutech.vn/... — sai giao thức so với đường họ gọi.
        # Đối tác luôn vào bằng HTTPS qua Cloudflare nên hằng số này mới đúng.
        proxy_set_header X-Forwarded-Proto https;

        # Job chạy emulator mất ~60 giây; mặc định 60s của nginx cắt đúng lúc
        # API sắp trả lời.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Artifact là APK/ZIP, có cái vài trăm MB. Bật buffering thì nginx ghi
        # tạm xuống đĩa trọn gói rồi mới trả — chậm và ăn đĩa. Tắt để stream.
        proxy_buffering         off;
        proxy_request_buffering off;
        client_max_body_size    0;
    }
}
