# Tên project đặt tường minh, KHÔNG để compose suy ra từ tên thư mục.
#
# Mặc định compose lấy tên thư mục chứa file — ở đây là `deploy` — rồi dán vào
# mọi thứ nó sinh ra: container `deploy-api-1`, volume `deploy_worker-avd`,
# network `deploy_app-relay`. Sai hai đường: `deploy` không nói lên app nào, và
# bất kỳ project nào khác trên cùng máy Docker cũng có thư mục tên `deploy` là
# đụng nhau. Ghim ở đây thì tên bám theo app, không bám theo chỗ đặt file.
name: app-relay

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles:
      - production
    env_file:
      - path: .env
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  api:
    # Fallback là namespace THẬT của dự án, không phải một tên chung chung.
    # Trước đây fallback là `apprelay` — tài khoản đó CÓ TỒN TẠI trên Docker Hub
    # nhưng không phải của mình. Thiếu .env là compose lặng lẽ đi kéo image của
    # người lạ (hoặc báo not found) thay vì dùng image mình vừa build.
    image: ${DOCKERHUB_USERNAME:-conghieudoan19}/app-relay-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    # Chỉ .env.api. `.env` KHÔNG nằm ở đây có chủ đích: compose đã tự đọc nó để
    # nội suy, thêm vào env_file chỉ có tác dụng bơm POSTGRES_PASSWORD và
    # JWT_SECRET vào bên trong container — hai thứ tiến trình API không dùng.
    env_file:
      - path: .env.api
        required: false
    ports:
      - "127.0.0.1:5500:5500"
    volumes:
      - api-artifacts:/data/artifacts
    healthcheck:
      # 127.0.0.1, not localhost: the container resolves localhost to ::1 first
      # while the server binds IPv4 0.0.0.0 only, so the probe gets ECONNREFUSED
      # and the container never turns healthy — which in turn blocks worker's
      # depends_on: service_healthy.
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:5500/v1/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  worker:
    image: ${DOCKERHUB_USERNAME:-conghieudoan19}/app-relay-worker:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    init: true
    # Xem ghi chú ở service api: cố ý không nạp `.env`. Worker chạy APK của bên
    # thứ ba trong emulator, càng ít secret trong môi trường của nó càng tốt.
    env_file:
      - path: .env.worker
        required: false
    depends_on:
      api:
        condition: service_healthy
    shm_size: "2gb"
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - worker-avd:/home/worker/.android
      - worker-work:/app/apps/worker/work
    networks:
      - internal

volumes:
  api-artifacts:
  worker-avd:
  worker-work:
  caddy-data:
  caddy-config:

# Key `internal`, không phải `app-relay`: compose đã tự thêm tiền tố tên project
# vào network, nên đặt key trùng tên project ra `app-relay_app-relay`. Key mô tả
# VAI TRÒ của mạng (nội bộ, không publish), tên project lo phần định danh.
networks:
  internal:

