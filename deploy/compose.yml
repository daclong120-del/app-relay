services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles:
      - production
    env_file:
      - path: .env
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-relay

  api:
    image: ${DOCKERHUB_USERNAME:-apprelay}/app-relay-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    # Chỉ .env.api. `.env` KHÔNG nằm ở đây có chủ đích: compose đã tự đọc nó để
    # nội suy, thêm vào env_file chỉ có tác dụng bơm POSTGRES_PASSWORD và
    # JWT_SECRET vào bên trong container — hai thứ tiến trình API không dùng.
    env_file:
      - path: .env.api
        required: false
    ports:
      - "127.0.0.1:5500:5500"
    volumes:
      - api-artifacts:/data/artifacts
    healthcheck:
      # 127.0.0.1, not localhost: the container resolves localhost to ::1 first
      # while the server binds IPv4 0.0.0.0 only, so the probe gets ECONNREFUSED
      # and the container never turns healthy — which in turn blocks worker's
      # depends_on: service_healthy.
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:5500/v1/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - app-relay

  worker:
    image: ${DOCKERHUB_USERNAME:-apprelay}/app-relay-worker:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    init: true
    # Xem ghi chú ở service api: cố ý không nạp `.env`. Worker chạy APK của bên
    # thứ ba trong emulator, càng ít secret trong môi trường của nó càng tốt.
    env_file:
      - path: .env.worker
        required: false
    depends_on:
      api:
        condition: service_healthy
    shm_size: "2gb"
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - worker-avd:/home/worker/.android
      - worker-work:/app/apps/worker/work
    networks:
      - app-relay

volumes:
  api-artifacts:
  worker-avd:
  worker-work:
  caddy-data:
  caddy-config:

networks:
  app-relay:

