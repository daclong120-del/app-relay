# Local, self-hosted stand-in for Supabase Cloud.
#
# Only the two pieces this project actually uses are here: Postgres and
# PostgREST behind a gateway that reproduces Supabase's /rest/v1 URL shape.
# No Auth, Storage or Realtime — setup_supbase.md rules all three out
# (no accounts, no binaries in the database).
#
# Usage:
#   docker compose -f compose.yml -f compose.kvm.yaml -f compose.supabase.yaml up -d
#
# On a deploy that points at Supabase Cloud, simply omit this file.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
    # Loopback only — for psql and `tsx scripts/db-migrate.ts` from the host.
    # Nothing outside this machine can reach the database.
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - supabase-db:/var/lib/postgresql/data
      # Ordered init: roles, then MỌI migration theo thứ tự tên, rồi grants
      # (phải chạy sau vì cần bảng đã tồn tại).
      #
      # Mount cả thư mục migrations thay vì trỏ cứng vào 001: trước đây thêm
      # migration mới mà quên sửa compose thì deploy sạch im lặng chạy với
      # schema cũ, và API chết khi đụng cột mới.
      - ./supabase-local/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
      - ./supabase-local/01-migrations.sh:/docker-entrypoint-initdb.d/01-migrations.sh:ro
      - ../supabase/migrations:/migrations:ro
      - ./supabase-local/02-grants.sql:/docker-entrypoint-initdb.d/02-grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  supabase:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./supabase-local/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rest
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    depends_on:
      supabase:
        condition: service_healthy

volumes:
  supabase-db:
